version: '3.8'

services:
  # Database MySQL
  db:
    image: mysql:8.0
    container_name: hotel_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/app/database/setup.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - hotel_network

  # Backend FastAPI
  backend:
    build: ./backend
    container_name: hotel_backend
    restart: always
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    volumes:
      - ./backend/uploaded_files:/app/uploaded_files
      - ./backend/debug_html:/app/debug_html
    networks:
      - hotel_network

  # Frontend VueJS + Nginx
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api   # Set Base URL to /api so requests go to nginx /api location
    container_name: hotel_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - hotel_network

volumes:
  mysql_data:

networks:
  hotel_network:
    driver: bridge
