name: Deploy to VPS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy files via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          source: "."
          target: "/root/hotel_scraper_project"
          # Cẩn thận: source "." sẽ copy cả .git, nên dùng exclude
          rm: false

      - name: Execute remote ssh commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            cd /root/hotel_scraper_project
            
            # Tạo file .env ở thư mục gốc để docker-compose đọc được biến ${...}
            echo "${{ secrets.ENV_FILE }}" > .env
            
            # Stop & Remove old containers to force recreate
            docker-compose down
            
            # Build and Start
            # --build để đảm bảo code mới được build lại
            docker-compose up -d --build
            
            # Prune unused images to save space
            docker image prune -f
